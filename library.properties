name=TinyWifiDongle
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=Header-only USB WiFi dongle: bridges the microcontroller's WiFi to a PC over USB (CDC-NCM).
paragraph=The MCU joins a WiFi network and exposes a USB network adapter to the host. Ethernet frames are bridged between USB and WiFi, so the host is a normal client of the WiFi network. Supports the ESP32-S3/S2 and the Raspberry Pi Pico W / Pico 2 W (ESP32-P4: compiles, USB untested).
category=Communication
