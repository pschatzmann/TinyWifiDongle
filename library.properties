sentence=Header-only USB WiFi dongle: bridges the microcontroller's WiFi to a PC over USB (CDC-NCM).
paragraph=The MCU joins a WiFi network and exposes a USB network adapter to the host. Ethernet frames are bridged between USB and WiFi, so the host is a normal client of the WiFi network. First port: ESP32-S3; RP2040 W planned.
